name: Installer CI and release

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-15
    defaults:
      run:
        working-directory: foundry-opencode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --ignore-scripts --registry=https://registry.npmjs.org
        working-directory: ${{ github.workspace }}
      - run: npm test
        working-directory: ${{ github.workspace }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  version:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.calculate.outputs.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: calculate
        run: |
          base=$(git describe --tags --first-parent --match 'v0.1.[0-9]*' --abbrev=0)
          patch=${base#v0.1.}
          [[ "$patch" =~ ^[0-9]+$ ]]
          commits=$(git rev-list --count --first-parent "$base"..HEAD)
          echo "number=0.1.$((patch + commits))" >> "$GITHUB_OUTPUT"

  build:
    if: github.event_name == 'push'
    needs: version
    strategy:
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: foundry-opencode
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
        env:
          FOUNDRY_OPENCODE_VERSION: ${{ needs.version.outputs.number }}
      - name: Package binary
        run: |
          test "$(target/${{ matrix.target }}/release/foundry-opencode version)" = "${{ needs.version.outputs.number }}"
          tar -czf foundry-opencode-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release foundry-opencode
      - uses: actions/upload-artifact@v4
        with:
          name: foundry-opencode-${{ matrix.target }}
          path: foundry-opencode/foundry-opencode-${{ matrix.target }}.tar.gz

  release:
    if: github.event_name == 'push'
    needs: [build, version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: foundry-opencode-*
          merge-multiple: true
      - name: Publish macOS binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: v${{ needs.version.outputs.number }}
        run: |
          shasum -a 256 foundry-opencode-*.tar.gz > SHA256SUMS
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" foundry-opencode-*.tar.gz SHA256SUMS --clobber
          else
            gh release create "$TAG" foundry-opencode-*.tar.gz SHA256SUMS --target "$GITHUB_SHA" --title "$TAG" --generate-notes
          fi
