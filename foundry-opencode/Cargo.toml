[package]
name = "foundry-opencode"
version = "0.1.0"
description = "Foundry OpenCode command-line utility and shared installer library"
authors = ["Demetry <demetryromanowski@gmail.com>"]
license = "MIT"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
color-eyre = "0.6.5"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
jsonc-parser = { version = "0.34", features = ["serde", "cst"] }
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
