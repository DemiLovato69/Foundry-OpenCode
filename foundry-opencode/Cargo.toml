[package]
name = "foundry-opencode"
version = "0.1.0"
description = "A guided installer for opencode Foundry configs. "
authors = ["Demetry <demetryromanowski@gmail.com>"]
license = "MIT"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
color-eyre = "0.6.5"
crossterm = "0.29.0"
ratatui = "0.30.2"
serde_json = "1"
jsonc-parser = { version = "0.34", features = ["serde", "cst"] }
libc = "0.2"
unicode-segmentation = "1"
unicode-width = "0.2"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
